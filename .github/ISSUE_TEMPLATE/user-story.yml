name: User story
description: Add a backlog item for SkillLoop.
title: "[Story]: "
labels: ["user-story"]
body:
  - type: markdown
    attributes:
      value: "Write a focused, testable story."
  - type: textarea
    id: story
    attributes:
      label: User story
      description: Use the format: As a ..., I want ..., so that ...
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable conditions required for completion.
      placeholder: |
        - [ ] ...
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - Must have
        - Should have
        - Could have
    validations:
      required: true
